# Versioned Perpetual strategy defaults.

perp:
  direction_mode: long_short
  value_area_pct: 68.0
  sl_mode: atr               # "atr" | "lowest"; lowest usa minimo/massimo strutturale
  structural_stop_lookback_candles: 20
  structural_stop_buffer_pct: 1.10 # long: minimo_20 -1.10%; short: massimo_20 +1.10%
  # FIX-2: rapporto minimo TP1/SL per accettare un segnale (0 = filtro spento).
  # Con sl_mode=atr il rapporto e' fisso a 3.125 e il filtro non scatta mai.
  # Con sl_mode=lowest lo stop e' piu' largo: a 1.2 respinge ~92% dei segnali,
  # a 0.6 e' il valore che massimizza i trade che arrivano a TP1 (vedi NOTE/16).
  min_rr: 1.2
  # SL/TP ancorati all'entry via ATR(14): R:R controllato a prescindere dalla leva.
  atr_stop_multiplier: 0.8   # SL = entry ∓ 0.8×ATR
  tp1_atr_multiplier: 2.5    # TP1 = entry ± 2.5×ATR (R:R ~1.67)
  tp2_atr_multiplier: 4.0    # TP2 = entry ± 4.0×ATR (R:R ~2.67)
  use_poc_for_tp2: true      # TP2 → POC se più ambizioso del target ATR
  # Protezione posizione: breakeven anticipato + trailing dinamico sulla leva.
  breakeven_enabled: true
  breakeven_trigger_atr: 1.0     # a +1×ATR lo SL sale a entry (+costi andata+ritorno)
  breakeven_offset_costs: true
  breakeven_buffer_pct: 0.1      # cuscinetto extra entry+0.1% (copre le fee; 0 = off)
  # Trailing: il moltiplicatore ATR scala con la leva del trade (base=leva min,
  # floor=leva max). Più alta la leva → trailing più stretto in prezzo.
  trailing_base_atr_largo: 4.0     # Largo: leva minima
  trailing_floor_atr_largo: 2.5    # Largo: leva massima
  trailing_base_atr_stretto: 2.5   # Stretto: leva minima
  trailing_floor_atr_stretto: 1.5  # Stretto: leva massima
  trailing_mode: largo             # default; override da setup mobile (largo|stretto)
  time_stop_enabled: false        # toggle UI/app-dashboard; default off
  time_stop_hours: 8
  # Profit Lock Ratchet: lavora SOLO nel tratto TP1→TP2 (si attiva dopo il TP1).
  # Ogni scalino e' [quota del tratto raggiunta, quota CUMULATIVA del residuo da
  # chiudere]: al 95% del tratto si e' chiuso l'80% e il 20% corre verso il TP2.
  profit_lock_steps:
    - [0.50, 0.25]
    - [0.70, 0.50]
    - [0.95, 0.80]
  ratchet_breakeven_pct: 50.0        # rientro dopo l'ultimo scalino: chiude tutto a meta' tratto
  ratchet_breakeven_after_step: 3    # da quale scalino si arma il breakeven del ratchet
  ratchet_run_beyond_tp2: true       # oltre il TP2 non chiude: lascia correre col trailing
  ratchet_trailing_pct: 1.0          # distacco del trailing dal massimo, oltre il TP2
  dynamic_leverage_enabled: true
  min_volume_profile_liquidity_usd: 50000.0
  default_leverage: 2
  # Range leva modulata sull'ATR in apertura (bassa vol → max, alta vol → min).
  min_leverage: 4
  max_leverage: 40
  leverage_atr_period: 72          # periodo ATR per la leva
  leverage_atr_baseline_hours: 120 # baseline storica per atr_min/atr_max (~5gg, cap 1500 candele)
  volume_profile_window_hours: 24
  volume_profile_candle_minutes: 5
  # Filtro shock BTC perp: blocca nuove aperture quando BTC mostra trend forte
  # + volatilita' o volume anomali (score >= 2 su 3). Indipendente dal reversal filter.
  # Filtro inversione di mercato sul PERP, indipendente da quello spot.
  # Default OFF: e' un filtro trend-following e sul perp lavora contro la strategia
  # mean-reversion (blocca i long proprio quando il prezzo rientra nel value area).
  # Misurato su 10 giorni di BTC 15m: blocca una direzione o l'altra il 99,7% del tempo.
  market_reversal_filter_enabled: false
  trend_shock_enabled: true
  trend_shock_adx_threshold: 25       # ADX >= soglia -> +1 allo score
  trend_shock_natr_percentile: 90     # NATR percentile >= soglia -> +1
  trend_shock_volume_threshold: 2.0   # relative volume >= soglia -> +1
  trend_shock_recovery_confirmations: 3  # check consecutivi score<=1 per tornare NORMAL
  # Smart Stop Loss: uscita scalata su 3 livelli con rebuy su rimbalzo
  smart_sl_enabled: true
  smart_sl_l1_frac: 0.333            # L1 = 33.3% della distanza entry→SL
  smart_sl_l2_frac: 0.666            # L2 = 66.6%
  smart_sl_split_l1: 0.25            # 25% della size venduta a L1
  smart_sl_split_l2: 0.55            # 55% a L2
  smart_sl_split_l3: 0.20            # 20% rimane, chiuso dal classico SL
  smart_sl_rebuy_mode: above_entry    # "above_entry" = rebuy tutto sopra entry | "delta" = rebuy per livello
  smart_sl_rebuy_above_entry_pct: 100  # % del venduto da ricomprare
  smart_sl_delta_l1: 0.08            # (solo modo delta) 8% di dist: rimbalzo per rebuy L1
  smart_sl_delta_l2: 0.16            # (solo modo delta) 16% di dist: rimbalzo per rebuy L2/L3
  smart_sl_split_l1_r2: 0.75          # (solo above_entry) round 2: 75% a L1
  smart_sl_split_l2_r2: 0.20          # round 2: 20% a L2
  smart_sl_split_l3_r2: 0.05          # round 2: 5% rimane a SL
  smart_sl_tp_adjust_after_rebuy: true  # ricalcola TP dopo rebuy per coprire perdite SSL
  smart_sl_tp_recovery_delta_pct: 7    # delta extra % oltre copertura perdite (guadagno minimo)
  smart_sl_confirmation_candles: 2   # candele 5min di conferma (sell e rebuy above_entry)
  smart_sl_max_reentries: 1          # max cicli sell→rebuy
  # Regime guardian (VERDE/GIALLO/ROSSO) driven by the bot's own full stop-losses
  # on a rolling window. YELLOW scales new entries, RED blocks them; open positions
  # stay managed. See NOTE/61 for the study behind defaults.
  guardian_enabled: true
  guardian_window_hours: 6.0         # rolling window for counting full stops
  guardian_yellow_stops: 1           # stops in window -> YELLOW
  guardian_red_stops: 2              # stops in window -> RED
  guardian_yellow_size_factor: 0.5   # new-entry size multiplier while YELLOW
  guardian_reentry_hours: 6.0        # clean hours per step-down RED->YELLOW->GREEN
  # Capital Preservation Mode: defensive management values applied while RED.
  # Read-time override only: the user's saved settings are never modified.
  defense_tp1_close_pct: 100.0       # bank the whole position at TP1 while RED
  defense_smart_sl_confirmation_candles: 0   # immediate L1/L2 partial sells while RED
  defense_profit_lock_steps:         # front-loaded ratchet while RED
    - [0.30, 0.50]
    - [0.50, 0.80]
    - [0.70, 1.00]
  defense_trailing_enabled: false
